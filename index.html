    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DollarTracker",
        "url": "https://dollartracker.vercel.app/",
        "description": "Cotizaciones del dólar, euro y real en Argentina, riesgo país y mercados, con histórico.",
        "applicationCategory": "FinanceApplication",

        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "ARS" }
      }

  </head>
  <body>
    <script>
      // Sigue el tema claro/oscuro del dispositivo, antes del primer pintado
      // (sin esto se veía un fogonazo del fondo equivocado en cada carga) y en
      // vivo si el sistema cambia, por ejemplo al llegar la noche.
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: light)");
        function aplicar() {
          var tema = mq.matches ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", tema);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", tema === "light" ? "#f4f6f8" : "#08090c");
        }
        aplicar();
        mq.addEventListener("change", aplicar);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
